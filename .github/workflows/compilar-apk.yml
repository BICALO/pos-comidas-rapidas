# Compila el APK de Android en los servidores de GitHub (gratis).
# Se ejecuta solo cada vez que subes cambios a la rama main/master, o a mano
# desde la pestana "Actions" > "Compilar APK Android" > "Run workflow".
# El APK queda para descargar en la ejecucion, seccion "Artifacts".
name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04  # trae el Android SDK instalado
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "No hay Android SDK en el servidor"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar Capacitor
        run: npm install

      - name: Construir la web (pantallas + motor local)
        run: node scripts/construir-web.js

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node scripts/preparar-android.js
          npx cap sync android
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Compilar APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "POS-Comidas-Rapidas-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: POS-Comidas-Rapidas-APK
          path: app-android/POS-Comidas-Rapidas-v1.0.${{ github.run_number }}.apk

      # Publica el APK como "Release": queda un enlace directo de descarga
      # (Releases > Latest) que se puede abrir desde el celular.
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "POS-Comidas-Rapidas-v1.0.${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "POS Comidas Rápidas v1.0.${{ github.run_number }}" \
            --notes "APK para instalar en Android. Descarga el archivo .apk de abajo desde el celular e instálalo (permite 'Instalar apps desconocidas'). Se puede instalar encima de una versión anterior sin perder datos." \
            --latest

      # Copia del APK en la rama 'apk' (respaldo de descarga)
      - name: Guardar APK en la rama apk
        run: |
          mkdir /tmp/rama && cp "POS-Comidas-Rapidas-v1.0.${{ github.run_number }}.apk" /tmp/rama/POS-Comidas-Rapidas.apk
          cd /tmp/rama
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add POS-Comidas-Rapidas.apk
          git commit -qm "APK v1.0.${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
