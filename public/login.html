<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; height:100vh; }
  .login-box { width: 320px; }
</style>
</head>
<body>
  <div class="card login-box">
    <h2>🍔 Comidas Rápidas</h2>
    <p style="font-size:13px; color:#666;">Inicia sesión para continuar</p>
    <label>Usuario</label>
    <input id="username" autofocus>
    <label>Contraseña</label>
    <input id="password" type="password">
    <div id="msg" class="error"></div>
    <br>
    <button onclick="entrar()" style="width:100%;">Ingresar</button>
  </div>

  <script src="js/comun.js"></script>
  <script>
    async function entrar() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        await api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        window.location.href = 'dashboard.html';
      } catch (e) {
        document.getElementById('msg').textContent = e.message;
      }
    }
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  </script>
</body>
</html>
