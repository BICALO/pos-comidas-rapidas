<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Usuarios</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h1>🍔 Comidas Rápidas</h1>
    <nav id="nav"></nav>
    <div class="userinfo" id="userinfo"></div>
  </div>
  <div class="container">
    <div class="card">
      <h2>Crear nuevo usuario</h2>
      <div class="flex">
        <div><label>Usuario (para iniciar sesión)</label><input id="username"></div>
        <div><label>Nombre completo</label><input id="nombre"></div>
        <div><label>Contraseña</label><input id="password" type="password"></div>
        <div><label>Rol</label>
          <select id="rol">
            <option value="vendedor">Vendedor (solo puede vender)</option>
            <option value="admin">Administrador (acceso total)</option>
          </select>
        </div>
      </div>
      <br>
      <button onclick="crearUsuario()">Crear usuario</button>
      <div id="msg" class="error"></div>
    </div>

    <div class="card">
      <h2>Usuarios del sistema</h2>
      <table>
        <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

  <script src="js/comun.js"></script>
  <script>
    async function cargar() {
      const usuarios = await api('/api/users');
      document.getElementById('tabla').innerHTML = usuarios.map(u => `
        <tr>
          <td>${u.username}</td>
          <td>${u.nombre}</td>
          <td><span class="badge ${u.rol === 'admin' ? 'admin' : ''}">${u.rol}</span></td>
          <td>${u.activo ? 'Activo' : 'Inactivo'}</td>
          <td><button class="small secondary" onclick="cambiarEstado(${u.id}, ${!u.activo})">${u.activo ? 'Desactivar' : 'Activar'}</button></td>
        </tr>`).join('');
    }

    async function crearUsuario() {
      document.getElementById('msg').textContent = '';
      try {
        await api('/api/users', { method: 'POST', body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          nombre: document.getElementById('nombre').value.trim(),
          password: document.getElementById('password').value,
          rol: document.getElementById('rol').value
        })});
        document.getElementById('username').value = '';
        document.getElementById('nombre').value = '';
        document.getElementById('password').value = '';
        cargar();
      } catch (e) {
        document.getElementById('msg').textContent = e.message;
      }
    }

    async function cambiarEstado(id, activo) {
      await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ activo }) });
      cargar();
    }

    (async () => {
      const user = await protegerPagina('usuarios.html', ['admin']);
      if (!user) return;
      cargar();
    })();
  </script>
</body>
</html>
